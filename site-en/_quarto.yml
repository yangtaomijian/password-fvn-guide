  comments:
    giscus:
      repo: yangtaomijian/password-fvn-guide
      repo-id: R_kgDOTnI-GQ
      category: 页面反馈
      category-id: DIC_kwDOTnI-Gc4DCPAP
      mapping: pathname
      reactions-enabled: true
      input-position: top
      theme:
        light: light
        dark: dark_dimmed
      language: en
