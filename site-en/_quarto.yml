format:
  html:
    canonical-url: true
    template-partials:
      - ../templates/metadata.html
    theme:
      light: cosmo
      dark: [cosmo, assets/pw-dark.scss]
    respect-user-color-scheme: true
    css:
      - assets/pw-guide-theme.css
      - assets/pw-color-schemes.css
      - assets/pw-search.css
    include-after-body:
      - assets/pw-layout-controls.html
      - assets/pw-search.html
      - assets/cloudflare-web-analytics.html
    toc: true
    toc-depth: 3
    smooth-scroll: true
    syntax-definitions:
      - assets/renpy.xml
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
