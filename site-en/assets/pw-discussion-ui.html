    retry: '重试', count: number => `${number} 条评论`, replies: '回复', persistent: '长期讨论', persistentNote: '由维护者保留，跨攻略版本显示。', all: '查看全站讨论', original: '最初攻略版本', missing: '此评论当前不可用。',
    add: '发表评论', reply: '回复', report: '举报', name: '昵称（可选）', body: '评论',
    identity: '无需账号；昵称不会验证身份。', rootSubmit: '发表评论',
    replySubmit: '发布回复', cancel: '取消', posting: '正在发布…',

    emptyBody: '请输入评论内容。', nameLong: '昵称不能超过 40 个字符。',
    bodyLong: '评论不能超过 2,000 个字符。',
    badHash: '对应段落链接过长。', badName: '请使用其他昵称。',
    verifyWait: '请先完成验证，再发布评论。',
    verifyLoad: '验证组件无法加载，请重试。',

    rateLimited: '提交过于频繁，请稍后再试。',

    postLocked: '此讨论已锁定；你的草稿仍然保留。',
    refreshFailed: '评论已发布，但讨论区未能刷新。重新加载页面即可查看。',
    verifyRetry: '重试验证', refresh: '刷新', refreshing: '正在刷新…',
    reloadFailed: '讨论刷新失败；已有评论和草稿仍然保留，请重试。',
    postUnknown: '发布结果不确定，草稿仍然保留。请先刷新核对评论是否已发布，再决定是否重新提交。',
    confirmUnposted: '已核对，确认未发布',
    replyTo: name => `回复 ${name}`, replyingTo: name => `正在回复 ${name}`,
    replyHidden: '回复已隐藏的评论', replyDeleted: '回复已删除的评论',
    replyMissing: '回复当前不可用的评论',
    replyUnavailable: '当前回复对象已不可用，草稿仍然保留。请刷新核对其状态。',
  };
  const reactionWords = context.locale === 'en' ? {
    label: 'Emoji reactions', add: 'Add a reaction', choices: 'Choose a reaction', selected: 'selected',
    loading: 'Loading reactions…', failed: 'Reactions couldn’t load. Try again.',

    names: { like: 'Helpful', heart: 'Thanks', smile: 'Happy', celebrate: 'Celebrate', thinking: 'Thinking' },

  };
  const dateFormat = new Intl.DateTimeFormat(context.locale, {
    year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
  });
  const make = (tag, className, value) => {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (value !== undefined) element.textContent = value;
    return element;
  };

  const section = make('section', 'pw-discussion');
  section.setAttribute('aria-labelledby', 'pw-discussion-title');
  const heading = make('h2', '', words.title);
  heading.id = 'pw-discussion-title';
  const headingRow = make('div', 'pw-discussion-heading');
  const hubLink = make('a', 'pw-discussion-hub-link', words.all);
  hubLink.href = (context.locale === 'en' ? '/en/' : '/') + 'discussions.html';
  const refresh = make('button', 'pw-discussion-action pw-discussion-refresh', words.refresh);
  refresh.type = 'button';
  headingRow.append(heading, refresh, hubLink);
  const explainer = make('p', 'pw-discussion-explainer', words.explainer);
  const versionContext = make('p', 'pw-discussion-version', `${words.current} · ${context.guideVersion}`);
  const status = make('div', 'pw-discussion-status');
  status.setAttribute('role', 'status');
  status.setAttribute('aria-live', 'polite');
  const postNotice = make('div', 'pw-discussion-post-notice');
  postNotice.setAttribute('role', 'status');
  postNotice.setAttribute('aria-live', 'polite');
  postNotice.tabIndex = -1;
  const lockedNotice = make('p', 'pw-discussion-locked', words.locked);
  lockedNotice.hidden = true;
  const rootAction = make('button', 'pw-discussion-action pw-discussion-add', words.add);
  rootAction.type = 'button'; rootAction.hidden = true;
  const composerHost = make('div', 'pw-discussion-composer-host');
  composerHost.hidden = true;
  const comments = make('div', 'pw-discussion-comments');
  const more = make('button', 'pw-discussion-action', words.loadMore);
  more.type = 'button'; more.hidden = true;
  const versions = make('section', 'pw-discussion-versions');
  versions.hidden = true;
  const versionsTitle = make('h3', '', words.earlier);
  const versionButtons = make('div', 'pw-discussion-version-buttons');
  versions.append(versionsTitle, versionButtons);
  const persistent = make('section', 'pw-discussion-persistent'); persistent.hidden = true;
  const persistentHeading = make('h3', '', words.persistent);
  const persistentNote = make('p', 'pw-discussion-explainer', words.persistentNote);
  const persistentComments = make('div', 'pw-discussion-persistent-comments');
  const persistentMore = make('button', 'pw-discussion-action', words.loadMore);
  persistentMore.type = 'button'; persistentMore.hidden = true;
  persistent.append(persistentHeading, persistentNote, persistentComments, persistentMore);
  section.append(headingRow, explainer, persistent, versionContext, status, postNotice, lockedNotice,
    rootAction, composerHost, comments, more, versions);
  mount.append(section);
  mount.hidden = false;

  const remoteMode = runtime.mode === 'staging' || runtime.mode === 'production';
  const writeEnabled = (remoteMode || (runtime.mode === 'fixture' && runtime.transport.fixtureCanWrite === true)) && typeof runtime.transport.postComment === 'function';
  const reportEnabled = (remoteMode || (runtime.mode === 'fixture' && runtime.transport.fixtureCanWrite === true)) && typeof runtime.transport.sendFeedback === 'function';
  const state = { persistent: null, activeVersion: context.guideVersion, pages: new Map(), index: [], pending: false,
    drafts: new Map(), uncertainTargets: new Set(), activeTarget: null, activeReplyRootId: null, replyUnavailable: false, opener: null, posting: false, threadLocked: false };
  const requestFor = (guideVersion, cursor = null, section = 'current') => ({
    site: context.site, locale: context.locale, pageKey: context.pageKey, guideVersion, cursor, section,
  });
  const read = async (guideVersion, cursor, section = 'current') => {
    const response = await runtime.transport.readDiscussion(requestFor(guideVersion, cursor, section));
    if (response?.ok !== true || !response.thread || !Array.isArray(response.currentVersion?.comments) ||
        response.currentVersion.guideVersion !== guideVersion || !Array.isArray(response.earlierVersions)) {
      throw Error('INVALID_DISCUSSION_RESPONSE');
    }
    return response;
  };
  // Reactions have their own cache, identity and errors. They never reject comment operations.
  const reactionTypes = ['like', 'heart', 'smile', 'celebrate', 'thinking'];
  const reactionEmoji = { like: '👍', heart: '❤️', smile: '😄', celebrate: '🎉', thinking: '🤔' };
  const reactionReadEnabled = typeof runtime.transport.readReactions === 'function';
  const reactionWriteEnabled = reactionReadEnabled && typeof runtime.transport.setReaction === 'function';
  const visitorStorageKey = 'carambi.password.reactionVisitorId';
  const reactionCache = new Map();
  // Epoch is only for view/identity changes; each comment independently owns its latest read token.
  let reactionEpoch = 0, reactionReadSerial = 0, reactionScheduled = false, reactionMenuId = null;
  let reactionVisitor, reactionStorageAvailable = false;
  const reactionEntry = id => {
    if (!reactionCache.has(id)) reactionCache.set(id, { data: null, pending: false, unknown: false,
      error: '', revision: 0, readToken: null });
    return reactionCache.get(id);
  };
  function visitorId() {
    let id = null;
    try {
      id = localStorage.getItem(visitorStorageKey);
      if (!/^[0-9a-f]{64}$/.test(id ?? '')) {
        const bytes = new Uint8Array(32); crypto.getRandomValues(bytes);
        id = Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
        localStorage.setItem(visitorStorageKey, id);
        if (localStorage.getItem(visitorStorageKey) !== id) throw Error('STORAGE_UNAVAILABLE');
      }
      reactionStorageAvailable = true;
    } catch { id = null; reactionStorageAvailable = false; }
    if (id !== reactionVisitor) {
      reactionVisitor = id; reactionEpoch++;
      for (const entry of reactionCache.values()) {
        // Keep public counts; selected/eligibility belong to the current stored identity.
        if (entry.data) entry.data = { ...entry.data, selected: [], canReact: false };
        entry.revision++; entry.unknown = false;
      }
    }
    return id;
  }
  function validReaction(row) {
    return row && typeof row.commentId === 'string' && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(row.commentId) &&
      typeof row.canReact === 'boolean' && row.counts && Object.keys(row.counts).length === reactionTypes.length &&
      reactionTypes.every(type => Number.isSafeInteger(row.counts[type]) && row.counts[type] >= 0) &&
      Array.isArray(row.selected) && new Set(row.selected).size === row.selected.length &&
      row.selected.every(type => reactionTypes.includes(type));
  }
  function reactionIds() {
    return [...section.querySelectorAll('.pw-discussion-reactions')].map(panel => panel.dataset.commentId);
  }
  function closeReactionMenu(restoreFocus = false) {
    const id = reactionMenuId; reactionMenuId = null;
    if (!id) return;
    updateReactionPanels(id);
    if (restoreFocus) section.querySelector(`.pw-discussion-reactions[data-comment-id="${id}"] .pw-discussion-reaction-add`)?.focus({ preventScroll: true });
  }
  function reactionPanel(id) {
    const panel = make('div', 'pw-discussion-reactions');
    panel.dataset.commentId = id;
    panel.setAttribute('role', 'group'); panel.setAttribute('aria-label', reactionWords.label);
    fillReactionPanel(panel);
    return panel;
  }
  function fillReactionPanel(panel) {
    const id = panel.dataset.commentId, entry = reactionEntry(id), data = entry.data;
    const focus = panel.contains(document.activeElement) ? document.activeElement : null;
    const desiredFocus = focus?.dataset.reactionType || (focus?.classList.contains('pw-discussion-reaction-add') ? 'add' : focus?.classList.contains('pw-discussion-reaction-retry') ? 'retry' : null) || (document.activeElement === panel ? panel.dataset.focusControl : null);
    delete panel.dataset.focusControl;
    panel.replaceChildren();
    panel.setAttribute('aria-busy', String(entry.pending || entry.readToken !== null));
    const disabled = !reactionWriteEnabled || !reactionStorageAvailable || data?.canReact !== true || entry.pending || entry.unknown || entry.readToken !== null;
    const chips = make('div', 'pw-discussion-reaction-chips');
    function button(type, menu) {
      const selected = data?.selected.includes(type) === true;
      const count = data?.counts[type] ?? 0;
      const node = make('button', 'pw-discussion-reaction', `${reactionEmoji[type]}${menu ? '' : ` ${count}`}${selected ? ' ✓' : ''}`);
      node.type = 'button'; node.dataset.reactionType = type;
      node.setAttribute('aria-pressed', String(selected));
      node.setAttribute('aria-label', `${reactionWords.names[type]} · ${count}${selected ? ` · ${reactionWords.selected}` : ''}`);
      node.disabled = disabled;
      node.addEventListener('click', () => {
        // Touch browsers need explicit focus before the pending panel replaces the button.
        node.focus({ preventScroll: true }); changeReaction(id, type);
      });
      return node;
    }
    for (const type of reactionTypes) if ((data?.counts[type] ?? 0) > 0) chips.append(button(type, false));
    const add = make('button', 'pw-discussion-reaction-add', '＋'); add.type = 'button';
    add.setAttribute('aria-label', reactionWords.add); add.setAttribute('aria-expanded', String(reactionMenuId === id));
    add.setAttribute('aria-controls', `pw-reaction-menu-${id}`); add.disabled = disabled;
    add.addEventListener('click', () => {
      if (reactionMenuId === id) { closeReactionMenu(true); return; }
      closeReactionMenu(); reactionMenuId = id; updateReactionPanels(id);
      section.querySelector(`#pw-reaction-menu-${id} button`)?.focus({ preventScroll: true });
    });
    chips.append(add); panel.append(chips);
    const menu = make('div', 'pw-discussion-reaction-menu'); menu.id = `pw-reaction-menu-${id}`;
    menu.setAttribute('role', 'group'); menu.setAttribute('aria-label', reactionWords.choices); menu.hidden = reactionMenuId !== id;
    for (const type of reactionTypes) menu.append(button(type, true));
    menu.addEventListener('keydown', event => {
      const buttons = [...menu.querySelectorAll('button')]; const index = buttons.indexOf(document.activeElement);
      const next = event.key === 'Home' ? 0 : event.key === 'End' ? 4 :
        ['ArrowRight', 'ArrowDown'].includes(event.key) ? (index + 1) % 5 :
        ['ArrowLeft', 'ArrowUp'].includes(event.key) ? (index + 4) % 5 : null;
      if (next !== null) { event.preventDefault(); buttons[next].focus(); }
    });
    panel.append(menu);
    const notice = make('div', 'pw-discussion-reaction-status'); notice.setAttribute('role', 'status'); notice.setAttribute('aria-live', 'polite');
    const text = entry.unknown ? reactionWords.unknown : entry.error || (!reactionStorageAvailable ? reactionWords.storage : !data ? reactionWords.loading : '');
    if (text) notice.append(make('span', '', text));
    if (entry.error || entry.unknown || !reactionStorageAvailable) {
      const retry = make('button', 'pw-discussion-reaction-retry', reactionWords.retry); retry.type = 'button';
      retry.disabled = entry.pending || entry.readToken !== null;
      retry.addEventListener('click', () => readReactions([id])); notice.append(retry);
    }
    panel.append(notice);
    if (!menu.hidden) { positionReactionMenu(); queueMicrotask(positionReactionMenu); }
    if (desiredFocus) {
      const selector = desiredFocus === 'add' ? '.pw-discussion-reaction-add' : desiredFocus === 'retry' ? '.pw-discussion-reaction-retry' : `${reactionMenuId === id ? '.pw-discussion-reaction-menu' : '.pw-discussion-reaction-chips'} [data-reaction-type="${desiredFocus}"]`;
      const control = panel.querySelector(selector) || add;
      if (!control.disabled) control.focus({ preventScroll: true });
      else { panel.tabIndex = -1; panel.dataset.focusControl = desiredFocus; panel.focus({ preventScroll: true }); }
    }
  }
  // Only geometry: keep the picker near + without growing or clipping the comment tree.
  function positionReactionMenu() {
    if (!reactionMenuId) return;
    const panel = section.querySelector(`.pw-discussion-reactions[data-comment-id="${reactionMenuId}"]`);
    const add = panel?.querySelector('.pw-discussion-reaction-add');
    const menu = panel?.querySelector('.pw-discussion-reaction-menu');
    if (!add?.isConnected || !menu || menu.hidden) return;
    const viewport = window.visualViewport;
    const leftEdge = (viewport?.offsetLeft ?? 0) + 8, topEdge = (viewport?.offsetTop ?? 0) + 8;
    const rightEdge = leftEdge + (viewport?.width ?? innerWidth) - 16;
    const bottomEdge = topEdge + (viewport?.height ?? innerHeight) - 16;
    menu.style.maxWidth = `${Math.max(44, rightEdge - leftEdge)}px`;
    const anchor = add.getBoundingClientRect(), bounds = menu.getBoundingClientRect();
    const toolbar = panel.closest('.pw-discussion-actions')?.getBoundingClientRect() ?? anchor;
    const below = Math.max(anchor.bottom, toolbar.bottom) + 6;
    const top = below + bounds.height <= bottomEdge ? below : Math.min(anchor.top, toolbar.top) - bounds.height - 6;
    menu.style.left = `${Math.max(leftEdge, Math.min(anchor.left, rightEdge - bounds.width))}px`;
    menu.style.top = `${Math.max(topEdge, Math.min(top, bottomEdge - bounds.height))}px`;
  }
  window.addEventListener('scroll', positionReactionMenu, true);
  window.addEventListener('resize', positionReactionMenu);
  window.visualViewport?.addEventListener('resize', positionReactionMenu);
  window.visualViewport?.addEventListener('scroll', positionReactionMenu);
  function updateReactionPanels(id) {
    section.querySelectorAll('.pw-discussion-reactions').forEach(panel => {
      if (!id || panel.dataset.commentId === id) fillReactionPanel(panel);
    });
  }
  async function readReactions(ids = reactionIds()) {
    if (!reactionReadEnabled) return;
    const visitor = visitorId(), generation = reactionEpoch;
    const token = ++reactionReadSerial;
    ids = [...new Set(ids)].filter(id => !reactionEntry(id).pending);
    const batches = []; for (let offset = 0; offset < ids.length; offset += 50) batches.push(ids.slice(offset, offset + 50));
    await Promise.all(batches.map(async commentIds => {
      const revisions = new Map(commentIds.map(id => [id, reactionEntry(id).revision]));
      commentIds.forEach(id => { reactionEntry(id).readToken = token; }); updateReactionPanels();
      try {
        const request = { pageKey: context.pageKey, locale: context.locale, commentIds };
        if (visitor) request.visitorId = visitor;
        const response = await runtime.transport.readReactions(request);
        if (response?.ok !== true || !Array.isArray(response.reactions) || response.reactions.length !== commentIds.length ||
            new Set(response.reactions.map(row => row?.commentId)).size !== commentIds.length ||
            !response.reactions.every(row => validReaction(row) && commentIds.includes(row.commentId))) throw Error('INVALID_REACTIONS');
        if (generation !== reactionEpoch || visitor !== reactionVisitor) return;
        for (const row of response.reactions) {
          const entry = reactionEntry(row.commentId);
          if (entry.pending || entry.readToken !== token || entry.revision !== revisions.get(row.commentId)) continue;
          entry.data = { commentId: row.commentId, counts: { ...row.counts }, selected: [...row.selected], canReact: row.canReact };
          entry.error = ''; entry.unknown = false;
        }
      } catch {
        if (generation === reactionEpoch) for (const id of commentIds) {
          const entry = reactionEntry(id);
          if (!entry.pending && entry.readToken === token && entry.revision === revisions.get(id)) entry.error = reactionWords.failed;
        }
      } finally {
        commentIds.forEach(id => { const entry = reactionEntry(id); if (entry.readToken === token) {
          entry.readToken = null;
          if (!entry.data && generation !== reactionEpoch && !entry.error) entry.error = reactionWords.failed;
        } });
        updateReactionPanels();
      }
    }));
  }
  function scheduleReactions() {
    if (!reactionReadEnabled || reactionScheduled) return;
    reactionScheduled = true;
    queueMicrotask(() => { reactionScheduled = false; readReactions(); });
  }
  async function changeReaction(id, type) {
    const entry = reactionEntry(id), previousVisitor = reactionVisitor, visitor = visitorId();
    if (visitor !== previousVisitor) { await readReactions([id]); return; }
    if (!visitor || !reactionWriteEnabled || entry.data?.canReact !== true || entry.pending || entry.unknown || entry.readToken !== null) {
      updateReactionPanels(id); return;
    }
    const intent = entry.data.selected.includes(type) ? 'remove' : 'add';
    entry.pending = true; entry.error = ''; const revision = ++entry.revision; const generation = reactionEpoch;
    closeReactionMenu(); updateReactionPanels(id);
    try {
      const response = await runtime.transport.setReaction({ pageKey: context.pageKey, locale: context.locale, commentId: id, type, visitorId: visitor, intent });
      if (response?.ok !== true || !validReaction(response.reaction) || response.reaction.commentId !== id) throw Error('INVALID_REACTION');
      if (entry.revision === revision && visitor === reactionVisitor) {
        entry.data = { commentId: id, counts: { ...response.reaction.counts }, selected: [...response.reaction.selected],
          canReact: generation === reactionEpoch && response.reaction.canReact };
        entry.unknown = false;
      }
    } catch (error) {
      if (entry.revision === revision && visitor === reactionVisitor) {
        const known = typeof error?.outcomeUnknown === 'boolean' ? !error.outcomeUnknown :
          ['RATE_LIMITED', 'THREAD_LOCKED', 'NOT_REACTABLE', 'VALIDATION_FAILED'].includes(error?.code);
        entry.unknown = !known;
        if (error?.notReactable || ['THREAD_LOCKED', 'NOT_REACTABLE'].includes(error?.code))
          entry.data = { ...entry.data, canReact: false };
        entry.error = error?.code === 'RATE_LIMITED' ? reactionWords.rate : reactionWords.writeFailed;
      }
    } finally {
      entry.pending = false; updateReactionPanels(id);
      // Unknown writes are reconciled only by a read. Never repeat the write automatically.
      if (entry.unknown || entry.data?.canReact === false || visitor !== reactionVisitor || generation !== reactionEpoch) await readReactions([id]);
    }
  }
  section.addEventListener('keydown', event => {
    if (event.key === 'Escape' && reactionMenuId) { event.preventDefault(); closeReactionMenu(true); }
  });
  document.addEventListener('pointerdown', event => {
    if (reactionMenuId && !event.target.closest('.pw-discussion-reactions')) closeReactionMenu();

      turnstileToken: usedToken, honeypot: honeypot.value,
    };
    try {
      const posted = await runtime.transport.postComment(payload);
      if (posted?.httpStatus !== 201) throw Error('DISCUSSION_POST_FAILED');
      state.drafts.delete(target); state.uncertainTargets.delete(target);
      state.activeTarget = null; state.activeReplyRootId = null; state.replyUnavailable = false; state.opener = null;
      clearWidget(); composerHost.hidden = true; comments.before(composerHost);
      postNotice.textContent = target === 'root' ? words.rootSuccess : words.replySuccess;
      postNotice.dataset.state = 'success';
      try {
        await refreshDiscussion();
        const rendered = posted.commentId && document.getElementById(`pw-comment-${posted.commentId}`);
        (rendered || postNotice).focus({ preventScroll: true });
      } catch {
        postNotice.textContent = words.refreshFailed;
        postNotice.focus({ preventScroll: true });
      }
    } catch (error) {
      saveDraft();
      const uncertain = outcomeUnknown(error);
      if (uncertain) state.uncertainTargets.add(target);
      const messageText = uncertain ? words.postUnknown : postError(error);
      if (!uncertain && error?.code === 'THREAD_LOCKED') {
        for (const page of state.pages.values()) page.status = 'locked';
        if (target === 'root') closeComposer(false);
        postNotice.textContent = messageText;
        try { await refreshDiscussion(); } catch { renderPage(); }
      } else if (!uncertain && target !== 'root' &&
          (error?.fieldErrors?.replyToCommentId || error?.fieldErrors?.parentCommentId)) {
        if (error.fieldErrors.replyToCommentId && selected) selected.comment.canReply = false;
        if (error.fieldErrors.parentCommentId && selected) selected.root.canReply = false;
        state.posting = false; renderPage(); formStatus.focus({ preventScroll: true });
      } else {
        state.posting = false;
        renderChallenge(messageText);
      }
    } finally {
      state.posting = false; cancel.disabled = false;
      updateSubmit();
      rootAction.disabled = refresh.disabled = state.pending;
      versionButtons.querySelectorAll('button').forEach(button => { button.disabled = state.pending; });
      more.disabled = persistentMore.disabled = state.pending;
      section.querySelectorAll('.pw-discussion-reply-action').forEach(button => { button.disabled = state.pending; });
      replayLocation();
    }
  }
  if (writeEnabled) {
    rootAction.addEventListener('click', () => openComposer('root', rootAction));
    cancel.addEventListener('click', () => closeComposer());
    verifyRetry.addEventListener('click', () => renderChallenge());
    confirmUnposted.addEventListener('click', () => {
      if (!state.activeTarget || state.pending || state.posting) return;
      const selected = activeReply();
      if (state.activeTarget !== 'root' && (!selected || !canReply(selected.root, selected.comment))) return;
      state.uncertainTargets.delete(state.activeTarget);
      renderChallenge();
    });
    nameInput.addEventListener('input', saveDraft);
    bodyInput.addEventListener('input', saveDraft);
    form.addEventListener('submit', submitDraft);
  }
  async function loadVersion(guideVersion) {
    if (state.pending || state.posting) return;
    const cached = state.pages.get(guideVersion);
    if (cached) {
      state.activeVersion = guideVersion;
      saveDraft(); message(); renderPage();
      return;
    }
    busy(true); message('loading');
    try {
      const response = await read(guideVersion, null);
      saveDraft(); rememberPersistent(response);
      const roots = response.currentVersion.comments;
      state.pages.set(guideVersion, {
        status: response.thread.status, comments: roots, seen: new Set(roots.map(root => root.id)),
        nextCursor: response.currentVersion.nextCursor,
      });
      if (guideVersion === context.guideVersion && !state.index.length)
        state.index = response.earlierVersions;
      state.activeVersion = guideVersion;
      message();
    } catch {
      message('error', () => loadVersion(guideVersion));
    } finally {
      busy(false); renderPage();
    }
  }
  async function loadMore() {
    const page = state.pages.get(state.activeVersion);
    if (state.pending || state.posting || !page?.nextCursor) return;
    saveDraft();
    const guideVersion = state.activeVersion;
    const cursor = page.nextCursor;
    busy(true); message('loading');
    try {
      const response = await read(guideVersion, cursor);
      for (const root of response.currentVersion.comments) {
        if (!page.seen.has(root.id)) { page.comments.push(root); page.seen.add(root.id); }
      }
      page.nextCursor = response.currentVersion.nextCursor;
      message();
    } catch {
      message('error', loadMore);
    } finally {
      busy(false); renderPage();
    }
  }
  function rememberPersistent(response, reset = false) {
    if (state.persistent && !reset) return;
    const page = response.persistent ?? { comments: [], nextCursor: null };
    if (!Array.isArray(page.comments)) throw Error('INVALID_DISCUSSION_RESPONSE');
    state.persistent = { comments: page.comments, seen: new Set(page.comments.map(root => root.id)), nextCursor: page.nextCursor };
  }
  async function loadPersistent() {
    const page = state.persistent;
    if (state.pending || state.posting || !page?.nextCursor) return;
    saveDraft(); busy(true); message('loading');
    try {
      const response = await read(context.guideVersion, page.nextCursor, 'persistent');
      if (!Array.isArray(response.persistent?.comments)) throw Error('INVALID_DISCUSSION_RESPONSE');
      for (const root of response.persistent.comments) if (!page.seen.has(root.id)) { page.comments.push(root); page.seen.add(root.id); }
      page.nextCursor = response.persistent.nextCursor; message();
    } catch { message('error', loadPersistent); }
    finally { busy(false); renderPage(); }
  }
  refresh.addEventListener('click', manualRefresh);
  persistentMore.addEventListener('click', loadPersistent);
  const anchorParams = new URLSearchParams(location.search);
  const historicalVersion = anchorParams.get('discussionVersion')?.trim();
  const initialVersion = anchorParams.get('discussionScope') !== 'persistent' && historicalVersion && Array.from(historicalVersion).length <= 80 ? historicalVersion : context.guideVersion;
  let locationGeneration = 0;
  let pendingLocation = false;
  let followingLocation = false;
  let locationReplayScheduled = false;
  let initializingLocation = true;
  function replayLocation() {
    if (!pendingLocation || state.pending || state.posting || followingLocation ||
        initializingLocation || locationReplayScheduled) return;
    locationReplayScheduled = true;
    queueMicrotask(() => {
      locationReplayScheduled = false;
      if (pendingLocation && !state.pending && !state.posting && !followingLocation && !initializingLocation)
        followLocation();
    });
  }
  async function locateComment() {
    const run = ++locationGeneration;
    const id = location.hash.slice(1);
    if (!new RegExp('^pw-comment-[0-9a-f]{8}-[0-9a-f-]{27}$', 'i').test(id)) return;
    const visited = new Set();
    while (run === locationGeneration) {
      const target = document.getElementById(id);
      if (target) { target.focus({ preventScroll: true }); target.scrollIntoView({ block: 'center', behavior: 'instant' }); return; }
      const persistentTarget = new URLSearchParams(location.search).get('discussionScope') === 'persistent';
      const page = persistentTarget ? state.persistent : state.pages.get(state.activeVersion);
      if (!page?.nextCursor || visited.has(page.nextCursor)) break;
      visited.add(page.nextCursor);
      if (persistentTarget) await loadPersistent(); else await loadMore();
      if (state.pending || state.posting) return;
    }
    if (run === locationGeneration) postNotice.textContent = words.missing;
  }
  async function followLocation() {
    // Browser history can move while controls are disabled. Keep the latest URL
    // pending and replay it after the active read/post finishes, without overlap.
    pendingLocation = true;
    locationGeneration++;
    if (state.pending || state.posting || followingLocation || initializingLocation) return;
    followingLocation = true;
    pendingLocation = false;
    try {
      const params = new URLSearchParams(location.search); const version = params.get('discussionVersion')?.trim();
      await loadVersion(params.get('discussionScope') !== 'persistent' && version && Array.from(version).length <= 80 ? version : context.guideVersion);
      if (!pendingLocation && !state.pending && !state.posting) await locateComment();
    } finally {
      followingLocation = false;
      replayLocation();
    }
  }
  window.addEventListener('hashchange', followLocation); window.addEventListener('popstate', followLocation);
  more.addEventListener('click', loadMore);
  loadVersion(context.guideVersion)
    .then(() => initialVersion === context.guideVersion ? undefined : loadVersion(initialVersion))
    .then(() => pendingLocation ? undefined : locateComment())
    .finally(() => { initializingLocation = false; replayLocation(); });
})();
</script>
