<script>
(() => {
  "use strict";

  // Desktop expansion is a separate user choice from Quarto's scrollspy.
  function installDesktopTocTree(toc, desktop) {
    if (!toc) return;
    const english = document.documentElement.lang.startsWith("en");
    const links = [...toc.querySelectorAll("a.nav-link")];
    const originalCurrent = new Map(links.map(link => [link, link.getAttribute("aria-current")]));
    const branches = [...toc.querySelectorAll(":scope > ul > li")].flatMap((item, index) => {
      const link = item.querySelector(":scope > a.nav-link");
      const list = item.querySelector(":scope > ul");
      if (!link || !list) return [];
      const originalHidden = list.getAttribute("aria-hidden");
      list.id ||= "guide-desktop-toc-branch-" + index;
      list.classList.add("guide-toc-branch");
      list.dataset.desktopExpanded = "true";
      item.classList.add("guide-toc-branch-item");
      const button = document.createElement("button");
      button.type = "button";
      button.className = "guide-toc-branch-toggle";
      button.hidden = !desktop.matches;
      button.setAttribute("aria-controls", list.id);
      const arrow = document.createElement("span");
      arrow.setAttribute("aria-hidden", "true");
      button.append(arrow);
      function sync() {
        const expanded = list.dataset.desktopExpanded === "true";
        button.setAttribute("aria-expanded", String(expanded));
        button.setAttribute("aria-label", (english ? (expanded ? "Collapse subsections: " : "Expand subsections: ") : (expanded ? "收起子目录：" : "展开子目录：")) + link.textContent.trim());
        arrow.textContent = expanded ? "▾" : "▸";
        if (desktop.matches) list.setAttribute("aria-hidden", String(!expanded));
        else if (originalHidden === null) list.removeAttribute("aria-hidden");
        else list.setAttribute("aria-hidden", originalHidden);
      }
      button.addEventListener("click", () => {
        if (!desktop.matches) return;
        const expanded = list.dataset.desktopExpanded !== "true";
        if (!expanded && list.contains(document.activeElement)) button.focus({ preventScroll: true });
        list.dataset.desktopExpanded = String(expanded);
        sync();
      });
      // Keep the link immediately before its list for native narrow-screen walking.
      link.before(button);
      sync();
      return [{ button, link, sync }];
    });
    function highlightParents() {
      const active = toc.querySelector("a.nav-link.active");
      const parents = new Set();
      if (desktop.matches) {
        let item = active?.closest("li")?.parentElement?.closest("li");
        while (item && toc.contains(item)) {
          const link = item.querySelector(":scope > a.nav-link");
          if (link) parents.add(link);
          item = item.parentElement?.closest("li");
        }
      }
      for (const link of links) {
        const parent = parents.has(link);
        if (link.classList.contains("guide-toc-parent") !== parent) link.classList.toggle("guide-toc-parent", parent);
        const current = desktop.matches && link === active ? "location" : originalCurrent.get(link);
        if (current === null) link.removeAttribute("aria-current");
        else if (link.getAttribute("aria-current") !== current) link.setAttribute("aria-current", current);
      }
    }
    function responsive() {
      for (const branch of branches) {
        if (!desktop.matches && document.activeElement === branch.button) branch.link.focus({ preventScroll: true });
        branch.button.hidden = !desktop.matches;
        branch.sync();
      }
      highlightParents();
    }
    new MutationObserver(highlightParents).observe(toc, { subtree: true, attributes: true, attributeFilter: ["class"] });
    desktop.addEventListener("change", responsive);
    responsive();
  }

  // Match the desktop TOC contract: edge reveal, with manual browsing priority.
  function installDesktopTocFollow(panel, toc, desktop, toolbarSelector) {
    if (!panel || !toc) return { queue() {}, resume() {} };
    installDesktopTocTree(toc, desktop);
    const article = document.getElementById("quarto-document-content");
    let paused = false, frame = 0;
    function followActive() {
      frame = 0;
      if (!desktop.matches || paused || panel.inert || !panel.getClientRects().length ||
          getComputedStyle(panel).visibility === "hidden") return;
      let active = toc.querySelector("a.nav-link.active");
      // A manually hidden current subsection follows its visible parent.
      while (active && !active.getClientRects().length) {
        active = active.closest("li")?.parentElement?.closest("li")?.querySelector(":scope > a.nav-link");
      }
      if (!active || !toc.contains(active)) return;
      const rail = panel.getBoundingClientRect(), link = active.getBoundingClientRect();
      // These sites keep a sticky toolbar inside the scrolling rail.
      const toolbar = panel.querySelector(toolbarSelector)?.getBoundingClientRect();
      const top = Math.max(rail.top, toolbar?.bottom || rail.top) + 24;
      const bottom = rail.bottom - 24;
      const delta = link.height > bottom - top || link.top < top ? link.top - top
        : link.bottom > bottom ? link.bottom - bottom : 0;
      const next = Math.max(0, Math.min(panel.scrollHeight - panel.clientHeight, panel.scrollTop + delta));
      if (Math.abs(next - panel.scrollTop) > 1) panel.scrollTo({ top: next, behavior: "instant" });
    }
    function queue() {
      if (!frame) frame = requestAnimationFrame(followActive);
    }
    function pause() { if (desktop.matches) paused = true; }
    function resume() { paused = false; queue(); }
    panel.addEventListener("pointerenter", event => {
      // Reopening puts the rail under the stationary pointer. That entrance
      // comes from the now-hidden opener, not a new attempt to browse the TOC.
      const opener = event.relatedTarget?.closest?.("button[aria-controls]");
      if (opener?.hidden && opener.getAttribute("aria-controls") === panel.id) return;
      pause();
    });
    panel.addEventListener("pointerdown", pause, { passive: true });
    panel.addEventListener("wheel", pause, { passive: true });
    panel.addEventListener("focusin", event => {
      if (event.target.closest("#TOC")) pause();
    });
    const readingInput = event => {
      if (!desktop.matches || panel.contains(event.target)) return;
      if (article?.contains(event.target) || event.target.closest?.("footer.footer")) resume();
    };
    document.addEventListener("wheel", readingInput, { capture: true, passive: true });
    document.addEventListener("touchstart", readingInput, { capture: true, passive: true });
    document.addEventListener("pointerdown", event => {
      if (desktop.matches && event.target === document.documentElement) resume();
    }, { passive: true });
    document.addEventListener("keydown", event => {
      if (!desktop.matches || !["ArrowUp", "ArrowDown", "PageUp", "PageDown", "Home", "End", " "].includes(event.key) ||
          panel.contains(event.target) || event.target.closest?.('input,textarea,select,[contenteditable="true"]')) return;
      if (article?.contains(event.target) || event.target === document.body || event.target === document.documentElement) resume();
    });
    toc.addEventListener("click", event => {
      if (desktop.matches && event.target.closest("a.nav-link")) resume();
    });
    new MutationObserver(queue).observe(toc, { subtree: true, attributes: true, attributeFilter: ["class"] });
    const resize = new ResizeObserver(queue);
    resize.observe(panel); resize.observe(toc);
    panel.addEventListener("scroll", queue, { passive: true });
    window.addEventListener("resize", queue);
    window.addEventListener("quarto-sectionChanged", queue);
    queue();
    return { queue, resume };
  }


  const LEFT_KEY = "pw-guide-left-sidebar-collapsed";
  const RIGHT_KEY = "pw-guide-right-toc-collapsed";
  const DESKTOP_TOC_KEY = "pw-desktop-toc-collapsed-v1";
  let desktopTocCollapsed = false;
  const readDesktopToc = () => {
    try { desktopTocCollapsed = sessionStorage.getItem(DESKTOP_TOC_KEY) === "1"; } catch {}
    return desktopTocCollapsed;
  };
  const DESKTOP_QUERY = window.matchMedia("(min-width: 1100px)");
  const RIGHT_PANEL_QUERY = window.matchMedia("(min-width: 768px)");
  const PAGE_PATHS = [
    "mechanics/affection-differences.html",
    "mechanics/medal-persistence.html",
    "mechanics/password-checks.html",
    "collectibles/compendium.html",
    "collectibles/gallery.html",
    "collectibles/medals.html",
    "versions/legacy-passwords.html",
    "versions/legacy-mechanics.html",
    "versions/legacy-routes.html",
    "versions/b085-changes.html",
    "guide/route-overview.html",
    "guide/password-hints.html",
    "guide/path-system.html",
    "mechanics/affection.html",
    "extras/easter-eggs.html",
    "guide/faq.html",
    "discussions.html",
    "index.html"
  ];
  const SHARED_FRAGMENTS = {
    "collectibles/compendium.html": ["florencia", "hoss", "orlando", "sal"],
    "collectibles/gallery.html": [
      "cg-unlock-index", "dave", "dean", "hoss", "memories", "orlando",
      "roswell", "sal", "trauma", "tyson"
    ],
    "extras/easter-eggs.html": [
      "chase", "civ", "rem", "the-end", "the-lovers", "timber", "wilson", "zylus"
    ],
    "guide/path-system.html": ["path-p"]
  };

  const safeLanguageHash = (pagePath) => {
    const hash = window.location.hash;
    if (!hash) return "";
    let id;
    try {
      id = decodeURIComponent(hash.slice(1));
    } catch {
      return "";
    }
    if (pagePath === "collectibles/medals.html" &&
        /^medal-(aries|taurus|gemini|cancer|leo|virgo|libra|scorpio|sagittarius|capricorn|aquarius|pisces)$/.test(id)) return hash;
    if (["mechanics/affection.html", "mechanics/affection-differences.html"].includes(pagePath) &&
        /^tabset-1-[1-6]$/.test(id)) return hash;
    if (pagePath === "collectibles/gallery.html" &&
        /^gallery-(memories-r(?:[1-9]|1[0-8])|trauma-r[1-7])-c[1-4]$/.test(id)) return hash;
    return SHARED_FRAGMENTS[pagePath]?.includes(id) ? hash : "";
  };

  const safeStorageGet = (key) => {
    try {
      return localStorage.getItem(key);
    } catch {
      return null;
    }
  };

  const safeStorageSet = (key, value) => {
    try {
      localStorage.setItem(key, value);
    } catch {
      /* Storage is optional; the current-page state still works. */
    }
  };

  const resolveEnglishTarget = () => {
    const pathname = window.location.pathname;
    const pagePath = PAGE_PATHS.find((candidate) =>
      pathname.endsWith(`/${candidate}`)
    );
    const siteRoot = pagePath
      ? pathname.slice(0, -pagePath.length)
      : pathname.endsWith("/")
        ? pathname
        : pathname.slice(0, pathname.lastIndexOf("/") + 1);
    const englishPath = pagePath && pagePath !== "index.html" ? pagePath : "";
    return `${siteRoot}en/${englishPath}${window.location.search}${safeLanguageHash(pagePath)}`;
  };


  // Move the existing link, preserving its URL/fragment listeners and identity.
  const placeLanguageSwitch = (link, tools) => {
    const sidebar = document.getElementById("quarto-sidebar");
    if (!sidebar) return;
    // Quarto toggles Headroom on opener clicks, but backdrop and API closes
    // bypass that click. Freeze from the actual top-level collapse lifecycle.
    const header = document.getElementById("quarto-header");
    const navigationPanels = [sidebar, document.getElementById("navbarCollapse")].filter(Boolean);
    const openPanels = new Set(navigationPanels.filter(panel => panel.classList.contains("show")));
    const syncHeadroom = () => {
      const frozen = header?.classList.contains("headroom--frozen");
      if (header && frozen !== (openPanels.size > 0)) window.quartoToggleHeadroom?.();
    };
    header?.querySelectorAll('[onclick*="quartoToggleHeadroom"]').forEach(control => control.removeAttribute("onclick"));
    for (const eventName of ["show.bs.collapse", "shown.bs.collapse", "hidden.bs.collapse"]) {
      document.addEventListener(eventName, event => {
        if (!navigationPanels.includes(event.target)) return;
        if (eventName === "hidden.bs.collapse") openPanels.delete(event.target);
        else openPanels.add(event.target);
        syncHeadroom();
      });
    }
    const restoreHeadroom = () => {
      openPanels.clear();
      navigationPanels.filter(panel => panel.classList.contains("show")).forEach(panel => openPanels.add(panel));
      syncHeadroom();
    };
    window.addEventListener("pageshow", restoreHeadroom);
    window.addEventListener("load", restoreHeadroom);
    syncHeadroom();
    const narrow = matchMedia("(max-width: 991.98px)");
    const footer = document.createElement("div");
    footer.className = "pw-nav-language";
    sidebar.append(footer);
    const label = link.textContent.trim();
    link.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>';
    link.append(document.createTextNode(label));
    const closeDesktopDrawer = () => {
      if (narrow.matches) return;
      document.querySelectorAll(".quarto-sidebar-collapse-item.show").forEach(panel => {
        window.bootstrap?.Collapse.getInstance(panel)?.hide();
      });
    };
    document.addEventListener("shown.bs.collapse", event => {
      if (event.target.matches(".quarto-sidebar-collapse-item")) closeDesktopDrawer();
    });
    const place = () => {
      const target = narrow.matches ? footer : tools;
      const focused = document.activeElement === link;
      footer.hidden = !narrow.matches;
      closeDesktopDrawer();
      if (link.parentElement === target) return;
      if (narrow.matches) target.append(link);
      else target.insertBefore(link, tools.querySelector(".pw-search-launcher"));
      if (focused) {
        const focusTarget = !narrow.matches || sidebar.classList.contains("show")
          ? link : document.querySelector("#quarto-header .quarto-btn-toggle");
        focusTarget?.focus({preventScroll: true});
      }
    };
    narrow.addEventListener("change", place);
    window.addEventListener("pageshow", place);
    place();
  };

  const createButton = ({
    className,
    label,
    icon,
    controls,
    onClick
  }) => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = className;
    button.setAttribute("aria-label", label);
    button.setAttribute("aria-controls", controls);
    button.setAttribute("title", label);

    const iconElement = document.createElement("span");
    iconElement.className = "pw-panel-toggle-icon";
    iconElement.setAttribute("aria-hidden", "true");
    iconElement.textContent = icon;

    button.append(iconElement);
    button.addEventListener("click", onClick);

    return button;
  };

  const createToolbar = (title, button) => {
    const toolbar = document.createElement("div");
    toolbar.className = "pw-panel-toolbar";

    const titleElement = document.createElement("span");
    titleElement.className = "pw-panel-toolbar-title";
    titleElement.textContent = title;

    toolbar.append(titleElement, button);
    return toolbar;
  };

  const syncNavbarActive = () => {
    const pathSegments = window.location.pathname
      .split("/")
      .filter(Boolean);
    const section = ["guide", "collectibles", "mechanics", "versions", "extras"]
      .find((candidate) => pathSegments.includes(candidate)) || "home";
    const sectionLabels = {
      home: "首页",
      guide: "攻略",
      collectibles: "收集",
      mechanics: "机制",
      versions: "版本档案",
      extras: "彩蛋"
    };
    const links = Array.from(document.querySelectorAll(
      "#quarto-header .navbar-nav > .nav-item > .nav-link"
    ));

    links.forEach((link) => {
      link.classList.remove("active");
      link.removeAttribute("aria-current");
    });

    const activeLink = links.find((link) =>
      link.querySelector(".menu-text")?.textContent
        .trim() === sectionLabels[section]
    );

    if (activeLink) {
      activeLink.classList.add("active");
      activeLink.setAttribute("aria-current", "page");
    }
  };

  const initialise = () => {
    const body = document.body;
    const rootElement = document.documentElement;

    if (rootElement.dataset.pwLayoutControlsInitialized === "true") {
      return;
    }

    rootElement.dataset.pwLayoutControlsInitialized = "true";

    // Easter Eggs remains a primary category even with a direct destination.
    document.querySelector('#quarto-sidebar .sidebar-menu-container > ul > li > .sidebar-item-container > a[href$="extras/easter-eggs.html"]')
      ?.closest('li').classList.add('pw-nav-direct-section');

    // Keep native/adaptive table ownership; every remaining source table gets
    // one local scroller, including Quarto's generated Bootstrap wrappers.
    document.querySelectorAll("main.content table").forEach((table) => {
      if (table.closest(".gallery-coordinate-table, #gallery-trigger-index, #gallery-non-gallery-index")) return;
      let scroll = table.closest(".table-responsive, .quarto-bootstrap-table, .pw-table-scroll");
      if (!scroll) {
        scroll = document.createElement("div");
        scroll.className = "pw-table-scroll";
        table.before(scroll);
        scroll.append(table);
      }
      scroll.classList.add("pw-mobile-table-scroll");
      scroll.setAttribute("tabindex", "0");
      scroll.setAttribute("role", "region");
      scroll.setAttribute("aria-label", document.documentElement.lang.startsWith("en")
        ? "Table; scroll horizontally if needed" : "表格；必要时可左右滚动");
    });


    rootElement.dataset.pwTablesReady = "true";
    document.dispatchEvent(new Event("pw:tables-ready"));

    // Dock the existing return control when the footer is visible, avoiding text overlap.
    const footer = document.querySelector("footer.footer");
    footer?.querySelectorAll(".nav-footer > div").forEach((slot) => {
      if (!slot.textContent.trim() && !slot.children.length) slot.textContent = "";
    });
    const footerCenter = footer?.querySelector(".nav-footer-center");
    const returnControl = document.getElementById("quarto-back-to-top");
    if (returnControl) {
      returnControl.setAttribute("aria-label", returnControl.textContent.trim());
      returnControl.setAttribute("tabindex", "0");
      returnControl.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        if (event.repeat) return;
        returnControl.click();
        const topTarget = document.querySelector("main.content h1") || document.querySelector("main.content");
        if (topTarget) {
          if (!topTarget.hasAttribute("tabindex")) topTarget.setAttribute("tabindex", "-1");
          topTarget.focus({ preventScroll: true });
        }
      });
    }
    if (footerCenter && !footerCenter.textContent.trim() && !footerCenter.children.length) {
      footerCenter.textContent = "";
      if (returnControl && "IntersectionObserver" in window) {
        const origin = document.createComment("return-control-origin");
        returnControl.before(origin);
        new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) footerCenter.append(returnControl);
          else origin.after(returnControl);
        }).observe(footer);
      }
    }

    syncNavbarActive();


    const leftSidebar = document.querySelector("#quarto-sidebar");

    // Remember explicit navigation-group choices across pages and languages.
    // Keep Quarto's active-section default until a group has a saved preference.
    if (leftSidebar) {
      const key = "pw-navigation-groups-v1";
      const groups = [...leftSidebar.querySelectorAll(".sidebar-section[id]")];
      const identities = new Map(groups.map(group => {
        const link = group.querySelector("a[href]");
        return [group, link ? new URL(link.href).pathname.replace(/\/en\//, "/") : null];
      }));
      const preferences = Object.create(null);
      const restoreGroups = () => {
        try {
          const saved = JSON.parse(localStorage.getItem(key));
          for (const identity of identities.values()) {
            if (identity && saved && typeof saved[identity] === "boolean") preferences[identity] = saved[identity];
          }
        } catch { /* Navigation remains usable when storage is unavailable. */ }
        for (const group of groups) {
          const expanded = preferences[identities.get(group)];
          if (typeof expanded !== "boolean") continue;
          group.classList.toggle("show", expanded);
          for (const toggle of leftSidebar.querySelectorAll(`[data-bs-target="#${group.id}"]`)) {
            toggle.classList.toggle("collapsed", !expanded);
            toggle.setAttribute("aria-expanded", String(expanded));
          }
        }
      };
      restoreGroups();
      leftSidebar.addEventListener("show.bs.collapse", event => {
        if (event.target === leftSidebar) restoreGroups();
      });
      // Bootstrap's delegated click handler updates aria-expanded before this
      // sidebar listener. Save that actual state, including ignored rapid clicks.
      // Drawer close and breakpoint/programmatic changes never write preferences.
      leftSidebar.addEventListener("click", event => {
        if (DESKTOP_QUERY.matches) return;
        const toggle = event.target.closest('[data-bs-toggle="collapse"]');
        const group = groups.find(group => toggle?.getAttribute("data-bs-target") === `#${group.id}`);
        const identity = identities.get(group);
        if (!identity) return;
        preferences[identity] = toggle.getAttribute("aria-expanded") === "true";
        try { localStorage.setItem(key, JSON.stringify(preferences)); } catch {}
      });
    }
    const rightSidebar = document.querySelector("#pw-page-toc-panel")?.querySelector("#TOC")?.parentElement;

    // Quarto already follows prefers-color-scheme while its override is absent.
    // Clear only that override to restore both initial and live system following.
    const nativeThemeToggle = document.querySelector(".quarto-color-scheme-toggle");
    if (nativeThemeToggle && !document.querySelector(".pw-theme-auto")) {
      const english = document.documentElement.lang.startsWith("en");
      const auto = document.createElement("button");
      auto.type = "button";
      auto.className = "pw-theme-auto quarto-navigation-tool";
      auto.textContent = english ? "Auto" : "自动";
      auto.title = english ? "Follow system appearance" : "跟随系统外观";
      auto.setAttribute("aria-label", auto.title);
      const sync = () => auto.setAttribute("aria-pressed", String(safeStorageGet("quarto-color-scheme") === null));
      sync();
      new MutationObserver(sync).observe(body, {attributes: true, attributeFilter: ["class"]});
      auto.addEventListener("click", () => {
        try {
          localStorage.removeItem("quarto-color-scheme");
          window.location.reload();
        } catch {
          // No persistent override can be stored when storage is unavailable.
          auto.setAttribute("aria-pressed", "true");
        }
      });
      nativeThemeToggle.after(auto);
    }

    // Keep the native theme control's accessible name in sync with its action.
    const syncThemeLabel = () => {
      const label = body.classList.contains("quarto-dark")
        ? "切换至浅色模式" : "切换至深色模式";
      document.querySelectorAll(".quarto-color-scheme-toggle").forEach((toggle) => {
        toggle.setAttribute("aria-label", label);
        toggle.setAttribute("title", label);
      });
    };
    syncThemeLabel();
    new MutationObserver(syncThemeLabel).observe(body, {
      attributes: true, attributeFilter: ["class"]
    });

    const installSearchLauncher = () => {
    const navbarInner = document.querySelector(
        ".navbar .container-fluid"
    );

    if (!navbarInner) return;

    let navbarTools = document.querySelector(
        ".navbar .quarto-navbar-tools"
    );

    if (!navbarTools) {
        navbarTools = document.createElement("div");
        navbarTools.className = "quarto-navbar-tools";
        navbarInner.append(navbarTools);
    }

    if (!navbarTools.querySelector(".pw-language-switch")) {
        const languageLink = document.createElement("a");
        const label = "Open this page in English";
        const refreshLanguageLink = () => {
          languageLink.href = resolveEnglishTarget();
        };

        languageLink.className = "pw-language-switch no-external";
        languageLink.textContent = "EN";
        languageLink.setAttribute("aria-label", label);
        languageLink.setAttribute("title", label);
        refreshLanguageLink();
        ["focus", "pointerdown", "contextmenu", "click"].forEach((event) => {
          languageLink.addEventListener(event, refreshLanguageLink);
        });
        languageLink.addEventListener("keydown", (event) => {
          if (event.key === "Enter") refreshLanguageLink();
        });
        ["pageshow", "hashchange", "popstate"].forEach((event) => {
          window.addEventListener(event, refreshLanguageLink);
        });
        navbarTools.append(languageLink);
        placeLanguageSwitch(languageLink, navbarTools);
    }

    if (navbarTools.querySelector(".pw-search-launcher")) {
        return;
    }

    const launcher = document.createElement("button");

    launcher.type = "button";
    launcher.className = "pw-search-launcher";
    launcher.setAttribute("aria-label", "搜索");
    launcher.setAttribute("title", "搜索");
    launcher.innerHTML = `
        <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="6.75"></circle>
        <path d="M16 16l4.25 4.25"></path>
        </svg>
    `;

    launcher.addEventListener("click", () => {
        const nativeButton = document.querySelector(
        "#quarto-search .aa-DetachedSearchButton, " +
        "#quarto-search button"
        );

        if (nativeButton) {
        nativeButton.click();
        return;
        }

        /*
        Quarto 原生搜索支持 /、s、f 快捷键。
        这里用 / 作为原生按钮尚未完成挂载时的后备方案。
        */
        const eventOptions = {
        key: "/",
        code: "Slash",
        bubbles: true,
        cancelable: true
        };

        document.dispatchEvent(
        new KeyboardEvent("keydown", eventOptions)
        );
    });

    navbarTools.append(launcher);
    };

    installSearchLauncher();

    /* 防止旧 reader-mode 按钮继续显示 */
    document.querySelectorAll(".quarto-reader-toggle").forEach((element) => {
      element.remove();
    });

    if (!leftSidebar && !rightSidebar) {
      return;
    }

    body.classList.add("pw-custom-layout-ready");

    const leftCollapseButton = createButton({
      className: "pw-panel-toggle pw-panel-toggle-left",
      label: "收起左侧导航",
      icon: "←",
      controls: "quarto-sidebar",
      onClick: () => {
        setLeftCollapsed(true);
        requestAnimationFrame(() => leftOpenButton.focus());
      }
    });

    const rightCollapseButton = createButton({
      className: "pw-panel-toggle pw-panel-toggle-right",
      label: "收起本页目录",
      icon: "→",
      controls: "pw-page-toc-panel",
      onClick: () => {
        setRightCollapsed(true);
        requestAnimationFrame(() => rightOpenButton.focus());
      }
    });

    const leftOpenButton = createButton({
      className: "pw-edge-toggle pw-edge-toggle-left",
      label: "展开左侧导航",
      icon: "→",
      controls: "quarto-sidebar",
      onClick: () => {
        setLeftCollapsed(false);
        requestAnimationFrame(() => leftCollapseButton.focus());
      }
    });

    const rightOpenButton = createButton({
      className: "pw-edge-toggle pw-edge-toggle-right",
      label: "展开本页目录",
      icon: "←",
      controls: "pw-page-toc-panel",
      onClick: () => {
        setRightCollapsed(false);
        requestAnimationFrame(() => rightCollapseButton.focus());
      }
    });

    if (leftSidebar) {
      leftSidebar.prepend(
        createToolbar("导航", leftCollapseButton)
      );

      document.body.append(leftOpenButton);
    }

    if (rightSidebar) {
      const english = document.documentElement.lang.startsWith("en");
      for (const [button, text] of [[rightCollapseButton, english ? "Collapse" : "收起"], [rightOpenButton, english ? "Expand TOC" : "展开目录"]]) {
        const label = document.createElement("span");
        label.className = "pw-desktop-toc-label";
        label.textContent = text;
        button.append(label);
      }
      rightSidebar.prepend(
        createToolbar("本页目录", rightCollapseButton)
      );

      document.body.append(rightOpenButton);

      /* 隐藏 Quarto 自带的重复“该页面内容”标题 */
      rightSidebar
        .querySelectorAll(
          "nav[role='doc-toc'] > h2, .toc-title"
        )
        .forEach((element) => {
          element.classList.add("pw-hide-default-toc-title");
        });
    }

    const header = document.getElementById("quarto-header");
    const measureHeader = () => {
      if (header) {
        rootElement.style.setProperty(
          "--pw-header-height", header.getBoundingClientRect().height + "px"
        );
      }
    };
    measureHeader();
    if (header && "ResizeObserver" in window) {
      new ResizeObserver(measureHeader).observe(header);
    }

    // Retain Quarto's real grid track as an empty slot. The visible TOC is
    // fixed to that track, so footer/detail height changes cannot push it away.
    if (rightSidebar) {
      const slot = document.createElement("div");
      slot.className = "pw-toc-slot";
      slot.setAttribute("aria-hidden", "true");
      rightSidebar.before(slot);
      const tablet = matchMedia("(min-width: 768px) and (max-width: 1099.98px)");
      const measureTocTrack = () => {
        if (!tablet.matches) return;
        const rect = slot.getBoundingClientRect();
        rootElement.style.setProperty("--pw-toc-track-left", `${rect.left}px`);
        rootElement.style.setProperty("--pw-toc-track-width", `${rect.width}px`);
        rightSidebar.classList.add("pw-toc-viewport-ready");
      };
      let pendingTrackFrame = 0;
      const scheduleTocTrack = () => {
        if (pendingTrackFrame) return;
        pendingTrackFrame = requestAnimationFrame(() => {
          pendingTrackFrame = 0;
          measureTocTrack();
        });
      };
      measureTocTrack();
      new ResizeObserver(scheduleTocTrack).observe(slot);
      window.addEventListener("resize", measureTocTrack);
      tablet.addEventListener("change", measureTocTrack);
    }

    const toc = rightSidebar?.querySelector("#TOC");
    const desktopTocFollow = installDesktopTocFollow(rightSidebar, toc, DESKTOP_QUERY, ".pw-panel-toolbar");
    const tocLinks = Array.from(toc?.querySelectorAll('a[data-scroll-target^="#"]') || [])
      .filter((link) => document.getElementById(link.getAttribute("data-scroll-target").slice(1)));
    const secondaryNav = document.querySelector(
      "#quarto-header .quarto-secondary-nav > .container-fluid"
    );
    let mobileToc = null;

    if (rightSidebar && tocLinks.length && secondaryNav) {
      const title = "本页目录";
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "pw-mobile-toc-toggle";
      toggle.textContent = title;
      toggle.hidden = true;
      toggle.setAttribute("aria-controls", rightSidebar.id);
      toggle.setAttribute("aria-expanded", "false");
      secondaryNav.append(toggle);

      const close = document.createElement("button");
      close.type = "button";
      close.className = "pw-mobile-toc-close";
      close.textContent = "×";
      close.setAttribute("aria-label", "关闭本页目录");
      rightSidebar.querySelector(".pw-panel-toolbar").append(close);

      const backdrop = document.createElement("div");
      backdrop.className = "pw-mobile-toc-backdrop";
      backdrop.hidden = true;
      backdrop.setAttribute("aria-hidden", "true");
      body.append(backdrop);
      body.classList.add("pw-mobile-toc-enabled");

      let open = false;
      const apply = () => {
        if (RIGHT_PANEL_QUERY.matches) {
          const hadFocus = rightSidebar.contains(document.activeElement);
          open = false;
          toggle.hidden = true;
          toggle.setAttribute("aria-expanded", "false");
          backdrop.hidden = true;
          body.classList.remove("pw-mobile-toc-open");
          rightSidebar.removeAttribute("role");
          rightSidebar.removeAttribute("aria-modal");
          rightSidebar.removeAttribute("aria-label");
          if (hadFocus) {
            requestAnimationFrame(() =>
              (body.classList.contains("pw-right-collapsed")
                ? rightOpenButton : rightCollapseButton).focus({ preventScroll: true })
            );
          }
          return;
        }

        toggle.hidden = false;
        toggle.setAttribute("aria-expanded", String(open));
        backdrop.hidden = !open;
        body.classList.toggle("pw-mobile-toc-open", open);
        rightSidebar.toggleAttribute("inert", !open);
        rightSidebar.setAttribute("aria-hidden", String(!open));
        if (open) {
          rightSidebar.setAttribute("role", "dialog");
          rightSidebar.setAttribute("aria-modal", "true");
          rightSidebar.setAttribute("aria-label", title);
        } else {
          rightSidebar.removeAttribute("role");
          rightSidebar.removeAttribute("aria-modal");
          rightSidebar.removeAttribute("aria-label");
        }
      };
      const closeToc = () => {
        if (!open) return;
        open = false;
        apply();
        requestAnimationFrame(() => toggle.focus({ preventScroll: true }));
      };
      toggle.addEventListener("click", () => {
        if (open) {
          closeToc();
        } else {
          open = true;
          apply();
          requestAnimationFrame(() => close.focus());
        }
      });
      close.addEventListener("click", closeToc);
      backdrop.addEventListener("click", closeToc);
      toc.addEventListener("click", (event) => {
        if (event.target.closest('a[data-scroll-target^="#"]')) closeToc();
      });
      document.addEventListener("keydown", (event) => {
        if (!open || RIGHT_PANEL_QUERY.matches) return;
        if (event.key === "Escape") {
          event.preventDefault();
          closeToc();
          return;
        }
        if (event.key !== "Tab") return;
        const focusable = [close, ...tocLinks].filter((element) =>
          element.getClientRects().length && getComputedStyle(element).visibility !== "hidden"
        );
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (!first) return;
        if (!rightSidebar.contains(document.activeElement) ||
            (event.shiftKey && document.activeElement === first) ||
            (!event.shiftKey && document.activeElement === last)) {
          event.preventDefault();
          (event.shiftKey ? last : first).focus();
        }
      });
      mobileToc = { apply };
    }

    function setLeftCollapsed(collapsed, persist = true) {
      if (!leftSidebar) return;

      body.classList.toggle("pw-left-collapsed", collapsed);
      leftSidebar.setAttribute(
        "aria-hidden",
        collapsed ? "true" : "false"
      );

      if ("inert" in leftSidebar) {
        leftSidebar.inert = collapsed;
      }

      syncPanelControls(
        leftCollapseButton,
        leftOpenButton,
        collapsed
      );

      if (persist) {
        safeStorageSet(LEFT_KEY, collapsed ? "1" : "0");
      }
    }

    function setRightCollapsed(collapsed, persist = true) {
      if (!rightSidebar) return;

      body.classList.toggle("pw-right-collapsed", collapsed);
      rightSidebar.setAttribute(
        "aria-hidden",
        collapsed ? "true" : "false"
      );

      if ("inert" in rightSidebar) {
        rightSidebar.inert = collapsed;
      }

      syncPanelControls(
        rightCollapseButton,
        rightOpenButton,
        collapsed
      );
      desktopTocFollow.queue();
      if (persist && !collapsed && DESKTOP_QUERY.matches) desktopTocFollow.resume();

      if (persist) {
        if (DESKTOP_QUERY.matches) {
          desktopTocCollapsed = collapsed;
          try { sessionStorage.setItem(DESKTOP_TOC_KEY, collapsed ? "1" : "0"); } catch {}
        } else safeStorageSet(RIGHT_KEY, collapsed ? "1" : "0");
      }
    }

    function syncPanelControls(collapseButton, openButton, collapsed) {
      const expanded = collapsed ? "false" : "true";

      collapseButton.setAttribute("aria-expanded", expanded);
      openButton.setAttribute("aria-expanded", expanded);
      openButton.hidden = !collapsed;
    }

    function applyResponsiveState() {
      const active = document.activeElement;
      const hadTocFocus = rightSidebar?.contains(active) || active === rightOpenButton || active?.matches(".pw-mobile-toc-toggle");
      if (DESKTOP_QUERY.matches) {
        // Desktop site navigation lives in the navbar; keep the hidden rail inert.
        setLeftCollapsed(true, false);
      } else {
        body.classList.remove("pw-left-collapsed");
        if (leftSidebar) {
          leftSidebar.removeAttribute("aria-hidden");
          if ("inert" in leftSidebar) leftSidebar.inert = false;
          syncPanelControls(leftCollapseButton, leftOpenButton, false);
        }
      }

      if (RIGHT_PANEL_QUERY.matches) {
        mobileToc?.apply();
        setRightCollapsed(DESKTOP_QUERY.matches ? readDesktopToc() : safeStorageGet(RIGHT_KEY) === "1", false);
      } else {
        body.classList.remove("pw-right-collapsed");
        if (rightSidebar) {
          rightSidebar.removeAttribute("aria-hidden");
          if ("inert" in rightSidebar) rightSidebar.inert = false;
          syncPanelControls(rightCollapseButton, rightOpenButton, false);
        }
        mobileToc?.apply();
      }
      if (hadTocFocus) requestAnimationFrame(() => {
        if (active.getClientRects().length && !active.closest("[inert]") && getComputedStyle(active).visibility !== "hidden") return;
        const target = RIGHT_PANEL_QUERY.matches
          ? (body.classList.contains("pw-right-collapsed") ? rightOpenButton : rightCollapseButton)
          : document.querySelector(".pw-mobile-toc-toggle");
        target?.focus({preventScroll:true});
      });
    }

    applyResponsiveState();
    window.addEventListener("pageshow", applyResponsiveState);
    DESKTOP_QUERY.addEventListener("change", applyResponsiveState);
    RIGHT_PANEL_QUERY.addEventListener("change", applyResponsiveState);
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initialise);
  } else {
    initialise();
  }
})();
</script>
