<script>
(() => {
  "use strict";

  const LEFT_KEY = "pw-guide-left-sidebar-collapsed";
  const RIGHT_KEY = "pw-guide-right-toc-collapsed";
  const DESKTOP_QUERY = window.matchMedia("(min-width: 1100px)");
  const RIGHT_PANEL_QUERY = window.matchMedia("(min-width: 768px)");
  const PAGE_PATHS = [
    "mechanics/affection-differences.html",
    "mechanics/medal-persistence.html",
    "mechanics/password-checks.html",
    "collectibles/compendium.html",
    "collectibles/gallery.html",
    "collectibles/medals.html",
    "versions/legacy-passwords.html",
    "versions/legacy-mechanics.html",
    "versions/legacy-routes.html",
    "versions/b085-changes.html",
    "guide/route-overview.html",
    "guide/password-hints.html",
    "guide/path-system.html",
    "mechanics/affection.html",
    "extras/easter-eggs.html",
    "guide/faq.html",
    "index.html"
  ];

  const safeStorageGet = (key) => {
    try {
      return localStorage.getItem(key);
    } catch {
      return null;
    }
  };

  const safeStorageSet = (key, value) => {
    try {
      localStorage.setItem(key, value);
    } catch {
      /* Storage is optional; the current-page state still works. */
    }
  };

  const resolveEnglishTarget = () => {
    const pathname = window.location.pathname;
    const pagePath = PAGE_PATHS.find((candidate) =>
      pathname.endsWith(`/${candidate}`)
    );
    const siteRoot = pagePath
      ? pathname.slice(0, -pagePath.length)
      : pathname.endsWith("/")
        ? pathname
        : pathname.slice(0, pathname.lastIndexOf("/") + 1);
    const englishPath = pagePath && pagePath !== "index.html" ? pagePath : "";
    return `${siteRoot}en/${englishPath}${window.location.search}${window.location.hash}`;
  };

  const createButton = ({
    className,
    label,
    icon,
    controls,
    onClick
  }) => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = className;
    button.setAttribute("aria-label", label);
    button.setAttribute("aria-controls", controls);
    button.setAttribute("title", label);

    const iconElement = document.createElement("span");
    iconElement.className = "pw-panel-toggle-icon";
    iconElement.setAttribute("aria-hidden", "true");
    iconElement.textContent = icon;

    button.append(iconElement);
    button.addEventListener("click", onClick);

    return button;
  };

  const createToolbar = (title, button) => {
    const toolbar = document.createElement("div");
    toolbar.className = "pw-panel-toolbar";

    const titleElement = document.createElement("span");
    titleElement.className = "pw-panel-toolbar-title";
    titleElement.textContent = title;

    toolbar.append(titleElement, button);
    return toolbar;
  };

  const initialise = () => {
    const body = document.body;
    const rootElement = document.documentElement;

    if (rootElement.dataset.pwLayoutControlsInitialized === "true") {
      return;
    }

    rootElement.dataset.pwLayoutControlsInitialized = "true";

    // Bare Markdown tables need the same local overflow containment as named tables.
    document.querySelectorAll("main.content table").forEach((table) => {
      if (table.closest(".table-responsive, .quarto-bootstrap-table, .pw-table-scroll, .gallery-coordinate-table, #gallery-trigger-index, #gallery-non-gallery-index")) return;
      const scroll = document.createElement("div");
      scroll.className = "pw-table-scroll";
      table.before(scroll);
      scroll.append(table);
    });


    // Dock the existing return control when the footer is visible, avoiding text overlap.
    const footer = document.querySelector("footer.footer");
    footer?.querySelectorAll(".nav-footer > div").forEach((slot) => {
      if (!slot.textContent.trim() && !slot.children.length) slot.textContent = "";
    });
    const footerCenter = footer?.querySelector(".nav-footer-center");
    const returnControl = document.getElementById("quarto-back-to-top");
    if (footerCenter && !footerCenter.textContent.trim() && !footerCenter.children.length) {
      footerCenter.textContent = "";
      if (returnControl && "IntersectionObserver" in window) {
        const origin = document.createComment("return-control-origin");
        returnControl.before(origin);
        new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) footerCenter.append(returnControl);
          else origin.after(returnControl);
        }).observe(footer);
      }
    }


    const leftSidebar = document.querySelector("#quarto-sidebar");
    const rightSidebar = document.querySelector("#quarto-margin-sidebar");

    // Quarto already follows prefers-color-scheme while its override is absent.
    // Clear only that override to restore both initial and live system following.
    const nativeThemeToggle = document.querySelector(".quarto-color-scheme-toggle");
    if (nativeThemeToggle && !document.querySelector(".pw-theme-auto")) {
      const english = document.documentElement.lang.startsWith("en");
      const auto = document.createElement("button");
      auto.type = "button";
      auto.className = "pw-theme-auto quarto-navigation-tool";
      auto.textContent = english ? "Auto" : "自动";
      auto.title = english ? "Follow system appearance" : "跟随系统外观";
      auto.setAttribute("aria-label", auto.title);
      const sync = () => auto.setAttribute("aria-pressed", String(safeStorageGet("quarto-color-scheme") === null));
      sync();
      new MutationObserver(sync).observe(body, {attributes: true, attributeFilter: ["class"]});
      auto.addEventListener("click", () => {
        try {
          localStorage.removeItem("quarto-color-scheme");
          window.location.reload();
        } catch {
          // No persistent override can be stored when storage is unavailable.
          auto.setAttribute("aria-pressed", "true");
        }
      });
      nativeThemeToggle.after(auto);
    }

    // Keep the native theme control's accessible name in sync with its action.
    const syncThemeLabel = () => {
      const label = body.classList.contains("quarto-dark")
        ? "切换至浅色模式" : "切换至深色模式";
      document.querySelectorAll(".quarto-color-scheme-toggle").forEach((toggle) => {
        toggle.setAttribute("aria-label", label);
        toggle.setAttribute("title", label);
      });
    };
    syncThemeLabel();
    new MutationObserver(syncThemeLabel).observe(body, {
      attributes: true, attributeFilter: ["class"]
    });

    const installSearchLauncher = () => {
    const navbarInner = document.querySelector(
        ".navbar .container-fluid"
    );

    if (!navbarInner) return;

    let navbarTools = document.querySelector(
        ".navbar .quarto-navbar-tools"
    );

    if (!navbarTools) {
        navbarTools = document.createElement("div");
        navbarTools.className = "quarto-navbar-tools";
        navbarInner.append(navbarTools);
    }

    if (!navbarTools.querySelector(".pw-language-switch")) {
        const languageLink = document.createElement("a");
        const label = "Open this page in English";

        languageLink.className = "pw-language-switch no-external";
        languageLink.href = resolveEnglishTarget();
        languageLink.textContent = "EN";
        languageLink.setAttribute("aria-label", label);
        languageLink.setAttribute("title", label);
        navbarTools.append(languageLink);
    }

    if (navbarTools.querySelector(".pw-search-launcher")) {
        return;
    }

    const launcher = document.createElement("button");

    launcher.type = "button";
    launcher.className = "pw-search-launcher";
    launcher.setAttribute("aria-label", "搜索");
    launcher.setAttribute("title", "搜索");
    launcher.innerHTML = `
        <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="6.75"></circle>
        <path d="M16 16l4.25 4.25"></path>
        </svg>
    `;

    launcher.addEventListener("click", () => {
        const nativeButton = document.querySelector(
        "#quarto-search .aa-DetachedSearchButton, " +
        "#quarto-search button"
        );

        if (nativeButton) {
        nativeButton.click();
        return;
        }

        /*
        Quarto 原生搜索支持 /、s、f 快捷键。
        这里用 / 作为原生按钮尚未完成挂载时的后备方案。
        */
        const eventOptions = {
        key: "/",
        code: "Slash",
        bubbles: true,
        cancelable: true
        };

        document.dispatchEvent(
        new KeyboardEvent("keydown", eventOptions)
        );
    });

    navbarTools.append(launcher);
    };

    installSearchLauncher();

    /* 防止旧 reader-mode 按钮继续显示 */
    document.querySelectorAll(".quarto-reader-toggle").forEach((element) => {
      element.remove();
    });

    if (!leftSidebar && !rightSidebar) {
      return;
    }

    body.classList.add("pw-custom-layout-ready");

    const leftCollapseButton = createButton({
      className: "pw-panel-toggle pw-panel-toggle-left",
      label: "收起左侧导航",
      icon: "←",
      controls: "quarto-sidebar",
      onClick: () => {
        setLeftCollapsed(true);
        requestAnimationFrame(() => leftOpenButton.focus());
      }
    });

    const rightCollapseButton = createButton({
      className: "pw-panel-toggle pw-panel-toggle-right",
      label: "收起本页目录",
      icon: "→",
      controls: "quarto-margin-sidebar",
      onClick: () => {
        setRightCollapsed(true);
        requestAnimationFrame(() => rightOpenButton.focus());
      }
    });

    const leftOpenButton = createButton({
      className: "pw-edge-toggle pw-edge-toggle-left",
      label: "展开左侧导航",
      icon: "→",
      controls: "quarto-sidebar",
      onClick: () => {
        setLeftCollapsed(false);
        requestAnimationFrame(() => leftCollapseButton.focus());
      }
    });

    const rightOpenButton = createButton({
      className: "pw-edge-toggle pw-edge-toggle-right",
      label: "展开本页目录",
      icon: "←",
      controls: "quarto-margin-sidebar",
      onClick: () => {
        setRightCollapsed(false);
        requestAnimationFrame(() => rightCollapseButton.focus());
      }
    });

    if (leftSidebar) {
      leftSidebar.prepend(
        createToolbar("导航", leftCollapseButton)
      );

      document.body.append(leftOpenButton);
    }

    if (rightSidebar) {
      rightSidebar.prepend(
        createToolbar("本页目录", rightCollapseButton)
      );

      document.body.append(rightOpenButton);

      /* 隐藏 Quarto 自带的重复“该页面内容”标题 */
      rightSidebar
        .querySelectorAll(
          "nav[role='doc-toc'] > h2, .toc-title"
        )
        .forEach((element) => {
          element.classList.add("pw-hide-default-toc-title");
        });
    }

    const header = document.getElementById("quarto-header");
    const measureHeader = () => {
      if (header) {
        rootElement.style.setProperty(
          "--pw-header-height", header.getBoundingClientRect().height + "px"
        );
      }
    };
    measureHeader();
    if (header && "ResizeObserver" in window) {
      new ResizeObserver(measureHeader).observe(header);
    }

    const toc = rightSidebar?.querySelector("#TOC");
    const tocLinks = Array.from(toc?.querySelectorAll('a[data-scroll-target^="#"]') || [])
      .filter((link) => document.getElementById(link.getAttribute("data-scroll-target").slice(1)));
    const secondaryNav = document.querySelector(
      "#quarto-header .quarto-secondary-nav > .container-fluid"
    );
    let mobileToc = null;

    if (rightSidebar && tocLinks.length && secondaryNav) {
      const title = "本页目录";
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "pw-mobile-toc-toggle";
      toggle.textContent = title;
      toggle.hidden = true;
      toggle.setAttribute("aria-controls", rightSidebar.id);
      toggle.setAttribute("aria-expanded", "false");
      secondaryNav.append(toggle);

      const close = document.createElement("button");
      close.type = "button";
      close.className = "pw-mobile-toc-close";
      close.textContent = "×";
      close.setAttribute("aria-label", "关闭本页目录");
      rightSidebar.querySelector(".pw-panel-toolbar").append(close);

      const backdrop = document.createElement("div");
      backdrop.className = "pw-mobile-toc-backdrop";
      backdrop.hidden = true;
      backdrop.setAttribute("aria-hidden", "true");
      body.append(backdrop);
      body.classList.add("pw-mobile-toc-enabled");

      let open = false;
      const apply = () => {
        if (RIGHT_PANEL_QUERY.matches) {
          const hadFocus = rightSidebar.contains(document.activeElement);
          open = false;
          toggle.hidden = true;
          toggle.setAttribute("aria-expanded", "false");
          backdrop.hidden = true;
          body.classList.remove("pw-mobile-toc-open");
          rightSidebar.removeAttribute("role");
          rightSidebar.removeAttribute("aria-modal");
          rightSidebar.removeAttribute("aria-label");
          if (hadFocus) {
            requestAnimationFrame(() =>
              (body.classList.contains("pw-right-collapsed")
                ? rightOpenButton : rightCollapseButton).focus({ preventScroll: true })
            );
          }
          return;
        }

        toggle.hidden = false;
        toggle.setAttribute("aria-expanded", String(open));
        backdrop.hidden = !open;
        body.classList.toggle("pw-mobile-toc-open", open);
        rightSidebar.toggleAttribute("inert", !open);
        rightSidebar.setAttribute("aria-hidden", String(!open));
        if (open) {
          rightSidebar.setAttribute("role", "dialog");
          rightSidebar.setAttribute("aria-modal", "true");
          rightSidebar.setAttribute("aria-label", title);
        } else {
          rightSidebar.removeAttribute("role");
          rightSidebar.removeAttribute("aria-modal");
          rightSidebar.removeAttribute("aria-label");
        }
      };
      const closeToc = () => {
        if (!open) return;
        open = false;
        apply();
        requestAnimationFrame(() => toggle.focus({ preventScroll: true }));
      };
      toggle.addEventListener("click", () => {
        if (open) {
          closeToc();
        } else {
          open = true;
          apply();
          requestAnimationFrame(() => close.focus());
        }
      });
      close.addEventListener("click", closeToc);
      backdrop.addEventListener("click", closeToc);
      toc.addEventListener("click", (event) => {
        if (event.target.closest('a[data-scroll-target^="#"]')) closeToc();
      });
      document.addEventListener("keydown", (event) => {
        if (!open || RIGHT_PANEL_QUERY.matches) return;
        if (event.key === "Escape") {
          event.preventDefault();
          closeToc();
          return;
        }
        if (event.key !== "Tab") return;
        const focusable = [close, ...tocLinks].filter((element) =>
          element.getClientRects().length && getComputedStyle(element).visibility !== "hidden"
        );
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (!first) return;
        if (!rightSidebar.contains(document.activeElement) ||
            (event.shiftKey && document.activeElement === first) ||
            (!event.shiftKey && document.activeElement === last)) {
          event.preventDefault();
          (event.shiftKey ? last : first).focus();
        }
      });
      mobileToc = { apply };
    }

    function setLeftCollapsed(collapsed, persist = true) {
      if (!leftSidebar) return;

      body.classList.toggle("pw-left-collapsed", collapsed);
      leftSidebar.setAttribute(
        "aria-hidden",
        collapsed ? "true" : "false"
      );

      if ("inert" in leftSidebar) {
        leftSidebar.inert = collapsed;
      }

      syncPanelControls(
        leftCollapseButton,
        leftOpenButton,
        collapsed
      );

      if (persist) {
        safeStorageSet(LEFT_KEY, collapsed ? "1" : "0");
      }
    }

    function setRightCollapsed(collapsed, persist = true) {
      if (!rightSidebar) return;

      body.classList.toggle("pw-right-collapsed", collapsed);
      rightSidebar.setAttribute(
        "aria-hidden",
        collapsed ? "true" : "false"
      );

      if ("inert" in rightSidebar) {
        rightSidebar.inert = collapsed;
      }

      syncPanelControls(
        rightCollapseButton,
        rightOpenButton,
        collapsed
      );

      if (persist) {
        safeStorageSet(RIGHT_KEY, collapsed ? "1" : "0");
      }
    }

    function syncPanelControls(collapseButton, openButton, collapsed) {
      const expanded = collapsed ? "false" : "true";

      collapseButton.setAttribute("aria-expanded", expanded);
      openButton.setAttribute("aria-expanded", expanded);
      openButton.hidden = !collapsed;
    }

    function applyResponsiveState() {
      if (DESKTOP_QUERY.matches) {
        setLeftCollapsed(safeStorageGet(LEFT_KEY) === "1", false);
      } else {
        body.classList.remove("pw-left-collapsed");
        if (leftSidebar) {
          leftSidebar.removeAttribute("aria-hidden");
          if ("inert" in leftSidebar) leftSidebar.inert = false;
          syncPanelControls(leftCollapseButton, leftOpenButton, false);
        }
      }

      if (RIGHT_PANEL_QUERY.matches) {
        mobileToc?.apply();
        setRightCollapsed(safeStorageGet(RIGHT_KEY) === "1", false);
      } else {
        body.classList.remove("pw-right-collapsed");
        if (rightSidebar) {
          rightSidebar.removeAttribute("aria-hidden");
          if ("inert" in rightSidebar) rightSidebar.inert = false;
          syncPanelControls(rightCollapseButton, rightOpenButton, false);
        }
        mobileToc?.apply();
      }
    }

    applyResponsiveState();
    DESKTOP_QUERY.addEventListener("change", applyResponsiveState);
    RIGHT_PANEL_QUERY.addEventListener("change", applyResponsiveState);
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initialise);
  } else {
    initialise();
  }
})();
</script>
